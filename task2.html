<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  </head>
<body>
  <h1>Student Registration Form</h1>
  <label><b>Roll No:&nbsp;</b></label>
  <input type="text" placeholder=""><br><br>
  <label><b>Student:&nbsp;</b></label>
  <input type="text" placeholder="First Name">
  <label>-</label>
  <input type="text" placeholder="Last Name"><br><br>
  <label><b>Father's name:&nbsp;</b></label>
  <input type="text"><br><br>
  <label><b>Date of Birth:&nbsp;</b></label>
  <input type="date"><br><br>
  <label><b>Mobile No:&nbsp;</b></label>
  <input type="number"><br><br>
  <label><b>Email Id:&nbsp;</b></label>
  <input type="email"><br><br>
  <label><b>Password:&nbsp;</b></label>
  <input type="password"><br><br>
  <label><b>Gender:&nbsp;</b></label>
  <input type="radio">
  <label><b>Male</b></label>
  <input type="radio">
  <label><b>Female</b></label><br><br>
  <label><b>Department:&nbsp;</b></label>
  <input type="checkbox">
  <label><b>CSE</b></label>
  <input type="checkbox">
  <label><b>IT</b></label>
  <input type="checkbox">
  <label><b>ECE</b></label>
  <input type="checkbox">
  <label><b>Civil</b></label>
  <input type="checkbox">
  <label><b>Mech</b></label><br><br>
  <label><b>Course:&nbsp;</b></label>
  <select>
    <option>----------Select Current Course------ </option>
    <option>Computer Science Engineering</option>
    <option>Information Technology</option>
    <option>Mechanical Engineering</option>
    <option>Civil Engineering</option>
  </select><br><br>
  <label><b>Student Photo:&nbsp;</b></label>
  <input type="file"><br><br>
  <label><b>City:&nbsp;</b></label>
  <input type="text"><br><br>
  <label><b>Address:&nbsp;</b></label>
  <textarea rows="5" cols="50"></textarea>
  
</body>
</html>
